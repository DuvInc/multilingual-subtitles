# Every URL below points at the upstream project. Forked this tool? Repoint
# them at your repository, or delete this folder.
blank_issues_enabled: false
contact_links:
  - name: Question or idea
    url: https://github.com/DuvInc/multilingual-subtitles/discussions
    about: Anything that is not a bug report or a concrete feature request.
  - name: Security issue
    url: https://github.com/DuvInc/multilingual-subtitles/security/advisories/new
    about: Please report privately rather than in a public issue.
  - name: A problem with Mistral or AI Glot
    url: https://console.mistral.ai
    about: Keys, credits, quality and quotas belong with those services.
