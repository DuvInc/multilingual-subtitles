name: CI

# Pull requests only get the default read-only token, and nothing here needs
# more. No secret is referenced, and `pull_request` (never
# `pull_request_target`) means a fork's code cannot reach one.
#
# Note what CI does NOT do: transcribe or translate anything. Both cost money
# per run. The tests cover the parts that decide what a subtitle file looks
# like, which is where the bugs are.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - run: npm test
      # The CLI must at least load and print its usage without a key, an API or
      # ffmpeg. A syntax error in a module that only runs mid-pipeline is
      # otherwise found by a user, halfway through a paid job.
      - run: node bin/subs.mjs || test $? -eq 2
